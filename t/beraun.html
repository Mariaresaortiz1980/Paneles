      if (id in cache) return cache[id];
      if (id in P.datasets) return (cache[id] = P.datasets[id]);
      const c = calcs[id]; if (!c) return undefined;
      return (cache[id] = c.fn(...c.inputs.map(get)));
    };

      subs.forEach((f) => { try { f(); } catch (e) { console.error(e); } });
      document.querySelectorAll('.hd-q').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.p === params.periodo)));

      params: () => params,
      setParams: (p) => { params = { ...params, ...p }; fire(); },
