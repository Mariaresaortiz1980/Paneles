<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Paneles tiendas Altesa</title>
<style>:root{--bg:#FAF9F5;--card:#fff;--tx:#1F1E1B;--mut:#6B6862;--bd:#E4E1D8;--acc:#E5B300;--lnk:#2F5D9E}@media(prefers-color-scheme:dark){:root{--bg:#1C1B19;--card:#262522;--tx:#EDEBE4;--mut:#A6A298;--bd:#3A3833;--lnk:#8DB4EC}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 48px}
.top{display:flex;align-items:center;gap:14px}.mark{width:44px;height:44px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-weight:800;color:#1F1E1B;font-size:20px}h1{font-size:24px;margin:0;text-transform:uppercase}.sub{color:var(--mut);margin:8px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--acc);border-radius:14px;padding:16px;text-decoration:none;color:var(--tx);display:flex;flex-direction:column;gap:6px}.card:hover{border-color:var(--acc)}
.card h2{margin:0;font-size:17px;text-transform:uppercase}.note{margin:0;font-size:12.5px;color:var(--mut)}.go{margin-top:auto;padding-top:8px;color:var(--lnk);font-weight:600;font-size:14px}.foot{margin-top:26px;font-size:13px;color:var(--mut)}</style></head>
<body><div class="wrap"><div class="top"><div class="mark">A</div><h1>Paneles de resultados · Altesa</h1></div><p class="sub">Las 11 tiendas en un solo sitio. Toca una tienda para abrir su panel.</p><div class="grid" id="g">Cargando…</div>
