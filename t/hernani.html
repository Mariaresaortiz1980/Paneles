      if (id in cache) return cache[id];
      if (id in P.datasets) return (cache[id] = P.datasets[id]);

      subs.forEach((f) => { try { f(); } catch (e) { console.error(e); } });

      params: () => params,
      setParams: (p) => { params = { ...params, ...p }; fire(); },
