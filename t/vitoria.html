    const fire = () => {
      subs.forEach((f) => { try { f(); } catch (e) { console.error(e); } });
      document.querySelectorAll('.hd-q').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.p === params.periodo)));
    };
    window.dash = {
      calc: (id, o) => { calcs[id] = o; },
      data: (id) => { try { const d = get(id); return d === undefined ? { status: 'missing' } : { status: 'ok', data: d }; } catch (e) { console.error(id, e); return { status: 'error' }; } },
      onData: (f) => { subs.push(f); },
      params: () => params,
      setParams: (p) => { params = { ...params, ...p }; fire(); },
    };

    const root = document.getElementById('dash-root');
    root.innerHTML = P.body;
    P.scripts.forEach((s) => { const el = document.createElement('script'); el.textContent = s; document.body.append(el); });
    // enlaces internos sin perder la clave
    document.addEventListener('click', (ev) => {
      const a = ev.target.closest('a[href^="#"]'); if (!a) return;
      const t = document.getElementById(a.getAttribute('href').slice(1)); if (t) { ev.preventDefault(); t.scrollIntoView({ behavior: 'smooth' }); }
    });
    let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fire, 200); });
    fire();
  } catch (e) { console.error(e); fail('<b>No se ha podido abrir el panel.</b><br>Prueba con Chrome, Safari o Edge actualizados.'); }
})();
</script>
</body>
</html>
